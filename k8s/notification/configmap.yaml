apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
data:
  DATABASE_HOST: notification-db
  DATABASE_PORT: "5432"
  DJANGO_DEBUG: "False"
  DJANGO_SETTINGS_MODULE: config.settings
  ALLOWED_HOSTS: "localhost,127.0.0.1,auth-service,auth-db,gateway,catalog-service,inventory-service,order-service,payment-service,notification-service,.local"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"