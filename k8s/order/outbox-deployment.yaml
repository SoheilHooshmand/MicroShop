apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-outbox
spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-outbox

  template:
    metadata:
      labels:
        app: order-outbox

    spec:
      containers:
        - name: order-outbox
          image: microshop-order-service:1.0.0
          imagePullPolicy: Never

          command:
            - sh
            - -c

          args:
            - |
              echo "Waiting for RabbitMQ..."

              until python -c "
              import os
              import pika

              url = os.environ['RABBITMQ_URL']

              connection = pika.BlockingConnection(
                  pika.URLParameters(url)
              )

              connection.close()
              "; do
                echo "RabbitMQ is not ready yet..."
                sleep 2
              done

              echo "RabbitMQ is ready."

              exec python manage.py publish_outbox

          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: DATABASE_HOST

            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: DATABASE_PORT

            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: POSTGRES_DB

            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: POSTGRES_USER

            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: POSTGRES_PASSWORD

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: order-app-secret
                  key: SECRET_KEY

            - name: CATALOG_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: order-app-secret
                  key: CATALOG_SERVICE_TOKEN

            - name: ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: ALLOWED_HOSTS

            - name: DJANGO_SETTINGS_MODULE
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: DJANGO_SETTINGS_MODULE

            - name: CATALOG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: CATALOG_SERVICE_URL

            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: order-app-secret
                  key: RABBITMQ_URL

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - python manage.py check

            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - python manage.py check

            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3