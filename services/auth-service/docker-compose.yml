services:

  auth_db:
    image: postgres:16
    container_name: microshop-auth-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_NAME: ${POSTGRES_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

volumes:
  auth_postgres_data: